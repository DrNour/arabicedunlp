[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabicedunlp"
version = "0.1.0"
description = "Arabic translation and post-editing analytics for NLP research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Noureldin Abdelaal" }
]
keywords = [
  "Arabic NLP",
  "machine translation",
  "post-editing",
  "translation technology",
  "educational NLP",
  "corpus analytics"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic"
]
dependencies = [
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.2", "twine>=5.0"]
analysis = ["scipy>=1.11", "numpy>=1.24", "matplotlib>=3.8"]

[project.scripts]
arabicedunlp = "arabicedunlp.cli:main"

[project.urls]
Homepage = "https://github.com/DrNour/arabicedunlp"
Repository = "https://github.com/DrNour/arabicedunlp"
Issues = "https://github.com/DrNour/arabicedunlp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
